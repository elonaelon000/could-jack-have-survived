name: Build and verify the Titanic exhibit
on:
  push:
    branches: [feature/titanic-interactive-exhibit]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exhibit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feature/titanic-interactive-exhibit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build the executed notebook, poster and static site
        run: python src/build.py
      - name: Verify source integrity and all research outputs
        run: python -m pytest -q tests
      - name: Save generated deliverables to this branch only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add notebooks/titanic_jack_analysis.ipynb poster/titanic_jack_poster.pdf poster/preview.png docs/index.html docs/evidence.json docs/notebook.html docs/titanic_jack_analysis.ipynb docs/titanic_jack_poster.pdf docs/poster-preview.png docs/.nojekyll
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build the portable notebook, poster and exhibit assets [skip ci]'
          git push origin "HEAD:$TARGET_BRANCH"
